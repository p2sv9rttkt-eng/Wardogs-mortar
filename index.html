<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wardogs Mortar">
<link rel="manifest" href="manifest.webmanifest">
<title>Wardogs Mortar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:600px;margin:auto;padding:20px 16px 32px}.card{background:#151c2e;border:1px solid #29334b;border-radius:18px;padding:16px;margin-bottom:14px}
h1{font-size:23px;margin:0 0 4px}.sub{color:#9aa6bd;font-size:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;color:#9aa6bd;display:block;margin-bottom:5px}
input{width:100%;height:48px;border-radius:12px;border:1px solid #35415c;background:#0e1424;color:white;padding:0 12px;font-size:17px}
button{min-height:48px;border:0;border-radius:12px;padding:0 15px;background:#26324b;color:white;font-weight:700;font-size:14px}
.primary{background:#22c55e;color:#07110a}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0e1424;border:1px solid #29334b;border-radius:14px;padding:14px}.big{font-size:28px;font-weight:800;margin-top:5px}
.small{color:#9aa6bd;font-size:12px}.status{padding:12px;border-radius:12px;background:#0e1424;color:#c8d0df;font-size:14px}.ok{border:1px solid #166534}.warn{border:1px solid #92400e}
@media(max-width:360px){main{padding:15px 11px}.grid{gap:7px}}
</style>
</head>
<body>
<main>
<div class="card"><h1>WARDOGS MORTAR</h1><div class="sub">L81 • mobilní kalkulačka zaměření</div>
<div class="grid">
<div><label>MINOMET X</label><input id="gx" inputmode="decimal" value="50"></div>
<div><label>MINOMET Y</label><input id="gy" inputmode="decimal" value="50"></div>
<div><label>CÍL X</label><input id="tx" inputmode="decimal" value="53"></div>
<div><label>CÍL Y</label><input id="ty" inputmode="decimal" value="54"></div>
</div>
<div class="actions"><button class="primary" id="calc">VYPOČÍTAT</button><button id="swap">↔ PROHODIT</button><button id="reset">RESET</button></div>
</div>
<div class="results">
<div class="stat"><div class="small">VZDÁLENOST</div><div class="big" id="dist">—</div><div class="small">metrů</div></div>
<div class="stat"><div class="small">AZIMUT</div><div class="big" id="az">—</div><div class="small">stupňů</div></div>
<div class="stat"><div class="small">MIL</div><div class="big" id="mil">—</div><div class="small">výškové nastavení</div></div>
<div class="stat"><div class="small">SMĚR</div><div class="big" id="dir">—</div><div class="small">kompas</div></div>
</div>
<div class="card"><div id="status" class="status">Zadej souřadnice a stiskni VYPOČÍTAT.</div></div>
<div class="card"><div style="font-weight:700;margin-bottom:9px">Rychlá korekce</div>
<div class="actions">
<button data-c="short">Krátká +10 m</button><button data-c="long">Dlouhá −10 m</button>
<button data-c="left">Vlevo 10 m</button><button data-c="right">Vpravo 10 m</button>
</div></div>
<div class="small">Kalkulačka používá souřadnicový model a výchozí balistickou aproximaci pro herní použití. Výsledky ověř ve hře.</div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id), n=id=>Number($(id).value.replace(',','.'));
function calc(){
 let gx=n('gx'),gy=n('gy'),tx=n('tx'),ty=n('ty');
 if(![gx,gy,tx,ty].every(Number.isFinite)){ $('status').textContent='Zkontroluj zadané hodnoty.';return}
 let dx=(tx-gx)*100,dy=(ty-gy)*100,d=Math.hypot(dx,dy);
 let az=(Math.atan2(dx,dy)*180/Math.PI+360)%360;
 let mil=Math.round(Math.max(150,Math.min(850,-.00114701481*d*d-.332151859*d+913.829631)));
 let dirs=['S','SV','V','JV','J','JZ','Z','SZ'];let dir=dirs[Math.round(az/45)%8];
 $('dist').textContent=Math.round(d);$('az').textContent=az.toFixed(1)+'°';$('mil').textContent=mil;$('dir').textContent=dir;
 $('status').textContent=d<132?'Cíl je mimo doporučený minimální rozsah.':d>684?'Cíl je mimo doporučený rozsah.':'Výpočet hotov — azimut '+az.toFixed(1)+'°, MIL '+mil+'.';
}
$('calc').onclick=calc;
$('swap').onclick=()=>{[['gx','tx'],['gy','ty']].forEach(([a,b])=>{let x=$(a).value;$(a).value=$(b).value;$(b).value=x});calc()};
$('reset').onclick=()=>{['gx','gy','tx','ty'].forEach((x,i)=>$(x).value=['50','50','53','54'][i]);calc()};
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
 let gx=n('gx'),gy=n('gy'),tx=n('tx'),ty=n('ty'),dx=tx-gx,dy=ty-gy,L=Math.hypot(dx,dy)||1,c=b.dataset.c;
 if(c==='short'||c==='long'){let s=c==='short'?1:-1;tx+=s*dx/L*.1;ty+=s*dy/L*.1}
 else {let s=c==='left'?-1:1;tx+=s*(-dy/L)*.1;ty+=s*(dx/L)*.1}
 $('tx').value=tx.toFixed(2);$('ty').value=ty.toFixed(2);calc();
});
calc();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
